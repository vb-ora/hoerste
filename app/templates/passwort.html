{% extends "basis.html" %}
{% block inhalt %}
<section class="karte schmal">
  <h2>Neues Passwort für {{ name }}</h2>
  <p class="hinweis">Mindestens 10 Zeichen. Danach bist du auf allen anderen Geräten abgemeldet.</p>
  <form data-api="/api/passwort-link/{{ token }}" class="formular">
    <input type="text" name="_name" value="{{ name }}" autocomplete="username" hidden>
    <label>Neues Passwort
      <input name="passwort" type="password" autocomplete="new-password" minlength="10" required>
    </label>
    <label>Passwort wiederholen
      <input name="passwort2" type="password" autocomplete="new-password" minlength="10" required>
    </label>
    <p class="meldung" role="alert" hidden></p>
    <button class="knopf" type="submit">Passwort speichern</button>
  </form>
</section>
{% endblock %}
